name: enotify production deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action
        required: true
        type: choice
        options: [install, start, status, restart, rollback, undeploy]
      state_dir:
        description: Persistent state directory on the deployment runner/host
        required: true
        default: /var/lib/enotify
      release_dir:
        description: Absolute durable release directory on the production host
        required: true
        default: /opt/enotify

jobs:
  deploy:
    # Bind this workflow to an explicitly approved production environment.
    environment: production
    runs-on: [self-hosted, linux, enotify-production]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/enotify-deploy
        with:
          action: ${{ inputs.action }}
          state-dir: ${{ inputs.state_dir }}
          release-dir: ${{ inputs.release_dir }}
