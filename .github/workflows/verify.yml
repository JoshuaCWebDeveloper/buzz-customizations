name: verify

on:
  pull_request:
  push:
    branches: [master, feat/enotify-foundation]

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: npm ci
      - run: npm run verify
