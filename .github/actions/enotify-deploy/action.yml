name: enotify deploy
description: Install or operate the enotify worker using a secret-reference environment file.
inputs:
  action:
    description: install, start, status, restart, rollback, or undeploy
    required: true
  state-dir:
    description: Persistent state directory on the target host
    required: true
  unit-dir:
    description: systemd unit directory on the target host
    required: false
    default: /etc/systemd/system
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ENOTIFY_ACTION: ${{ inputs.action }}
        ENOTIFY_STATE_DIR: ${{ inputs.state-dir }}
        ENOTIFY_UNIT_DIR: ${{ inputs.unit-dir }}
      run: python3 packages/enotify/deploy.py "$ENOTIFY_ACTION" --state-dir "$ENOTIFY_STATE_DIR" --unit-dir "$ENOTIFY_UNIT_DIR"
